name: saas_admin_flutter_app
description: "LiquorPro SaaS Admin - Advanced admin dashboard for managing SaaS operations"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.8
  cached_network_image: ^3.3.0
  fl_chart: ^0.64.0
  shimmer: ^3.0.0
  lottie: ^2.7.0

  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^2.4.5

  # Navigation
  go_router: ^12.1.3

  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.3
  pretty_dio_logger: ^1.3.1
  json_annotation: ^4.8.1

  # Storage & Security
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Authentication & Biometrics
  local_auth: ^2.1.6
  crypto: ^3.0.3

  # Utils & Helpers
  intl: ^0.20.2
  equatable: ^2.0.5
  uuid: ^4.1.0
  path_provider: ^2.1.1
  url_launcher: ^6.2.1
  share_plus: ^7.2.1

  # Device Info & Permissions
  device_info_plus: ^9.1.1
  permission_handler: ^11.0.1
  connectivity_plus: ^5.0.1
  image_picker: ^1.0.4

  # PDF & File Export
  pdf: ^3.10.7
  open_file: ^3.3.2

  # Notifications
  flutter_local_notifications: ^16.2.0

  # Responsive Design
  responsive_framework: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  json_serializable: ^6.7.1
  build_runner: ^2.4.7
  mockito: ^5.4.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
