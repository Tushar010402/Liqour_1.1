# Prometheus Configuration for LiquorPro Production

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'liquorpro-production'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # Add AlertManager if configured:
          # - targets: ['alertmanager:9093']

# Load alert rules
rule_files:
  - 'alerts.yml'

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter - System metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # cAdvisor - Container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Gateway Service
  - job_name: 'gateway'
    static_configs:
      - targets: ['172.20.0.1:8090']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Auth Service
  - job_name: 'auth'
    static_configs:
      - targets: ['172.20.0.1:8091']
    metrics_path: '/metrics'

  # Sales Service
  - job_name: 'sales'
    static_configs:
      - targets: ['172.20.0.1:8092']
    metrics_path: '/metrics'

  # Inventory Service
  - job_name: 'inventory'
    static_configs:
      - targets: ['172.20.0.1:8093']
    metrics_path: '/metrics'

  # Finance Service
  - job_name: 'finance'
    static_configs:
      - targets: ['172.20.0.1:8094']
    metrics_path: '/metrics'

  # SaaS Service
  - job_name: 'saas'
    static_configs:
      - targets: ['172.20.0.1:8095']
    metrics_path: '/metrics'

  # PostgreSQL Exporter (optional - requires postgres_exporter)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # Redis Exporter (optional - requires redis_exporter)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
