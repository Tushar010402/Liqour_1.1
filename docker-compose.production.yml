# LiquorPro Production Docker Compose
# Optimized for high performance, security, and reliability
# Server: 72.60.96.174
#
# IMPORTANT: This file REQUIRES .env.production
# The env_file is hardcoded below - DO NOT run without it!

# Default environment file for ALL services
# This ensures env vars are always loaded even if --env-file is forgotten
x-common-env: &common-env
  env_file:
    - .env.production

services:
  # ========================================
  # Database Services
  # ========================================

  postgres:
    image: postgres:15-alpine
    container_name: liquorpro-postgres-prod
    restart: unless-stopped
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_MULTIPLE_EXTENSIONS: uuid-ossp,pg_trgm
    ports:
      - "127.0.0.1:5432:5432"  # Bind to localhost only
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - /opt/liquorpro/logs/postgres:/var/log/postgresql
      - /opt/liquorpro/config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    networks:
      - liquorpro-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
          pids: 512
        reservations:
          cpus: '1.0'
          memory: 1G
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        compress: "true"

  redis:
    image: redis:7-alpine
    container_name: liquorpro-redis-prod
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 1536mb
      --maxmemory-policy volatile-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --appendonly no
      --tcp-keepalive 300
    ports:
      - "127.0.0.1:6379:6379"  # Bind to localhost only
    volumes:
      - redis_data:/data
      - /opt/liquorpro/logs/redis:/var/log/redis
    networks:
      - liquorpro-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        compress: "true"

  # ========================================
  # Database Migrations (runs first)
  # ========================================

  migrations:
    build:
      context: .
      dockerfile: Dockerfile.migrations
    image: liquorpro/migrations:${VERSION:-latest}
    container_name: liquorpro-migrations-prod
    restart: "no"  # Run once only
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - liquorpro-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================
  # Microservices
  # ========================================

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
      args:
        - BUILD_DATE=${BUILD_DATE}
        - VERSION=${VERSION}
        - GIT_COMMIT=${GIT_COMMIT}
    image: liquorpro/gateway:${VERSION:-latest}
    container_name: liquorpro-gateway-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"  # Bind to localhost only
    environment:
      - APP_ENVIRONMENT=production
      - SERVER_HOST=0.0.0.0
      # Extended timeouts for proxying AI/OCR requests
      - SERVER_READ_TIMEOUT=300
      - SERVER_WRITE_TIMEOUT=300
      - SERVER_IDLE_TIMEOUT=300
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_HOURS=${JWT_EXPIRATION_HOURS}
      - JWT_REFRESH_HOURS=${JWT_REFRESH_HOURS}
      - SERVICES_AUTH_URL=http://auth:8091
      - SERVICES_SALES_URL=http://sales:8092
      - SERVICES_INVENTORY_URL=http://inventory:8093
      - SERVICES_FINANCE_URL=http://finance:8094
      - SERVICES_SAAS_URL=http://saas:8095
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      - KAFKA_ENABLED=${KAFKA_ENABLED:-false}
      - GOMAXPROCS=2
      - DB_MAX_OPEN_CONNS=25
      - DB_MAX_IDLE_CONNS=10
      - DB_CONN_MAX_LIFETIME=1h
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - liquorpro-network
    volumes:
      - /opt/liquorpro/logs/gateway:/var/log/liquorpro
      - /var/www/liquorpro/uploads:/var/www/liquorpro/uploads:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1.5G
          pids: 256
        reservations:
          cpus: '0.5'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        compress: "true"

  auth:
    build:
      context: .
      dockerfile: Dockerfile.auth
      args:
        - BUILD_DATE=${BUILD_DATE}
        - VERSION=${VERSION}
        - GIT_COMMIT=${GIT_COMMIT}
    image: liquorpro/auth:${VERSION:-latest}
    container_name: liquorpro-auth-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      - APP_ENVIRONMENT=production
      - SERVER_HOST=0.0.0.0
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_HOURS=${JWT_EXPIRATION_HOURS}
      - JWT_REFRESH_HOURS=${JWT_REFRESH_HOURS}
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      - KAFKA_ENABLED=${KAFKA_ENABLED:-false}
      - GOMAXPROCS=1
      - DB_MAX_OPEN_CONNS=25
      - DB_MAX_IDLE_CONNS=10
      - DB_CONN_MAX_LIFETIME=1h
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - liquorpro-network
    volumes:
      - /opt/liquorpro/logs/auth:/var/log/liquorpro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8091/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 256
        reservations:
          cpus: '0.25'
          memory: 128M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        compress: "true"

  sales:
    build:
      context: .
      dockerfile: Dockerfile.sales
      args:
        - BUILD_DATE=${BUILD_DATE}
        - VERSION=${VERSION}
        - GIT_COMMIT=${GIT_COMMIT}
    image: liquorpro/sales:${VERSION:-latest}
    container_name: liquorpro-sales-prod
    restart: unless-stopped
    # IMPORTANT: Always load production env file to prevent missing API keys
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:8092:8092"
    volumes:
      - ./credentials:/app/credentials:ro
      - ./config/firebase:/app/config/firebase:ro
      - /opt/liquorpro/logs/sales:/var/log/liquorpro
      - /var/www/liquorpro/uploads:/root/uploads  # Persist uploaded images
    environment:
      - APP_ENVIRONMENT=production
      - SERVER_HOST=0.0.0.0
      # Extended timeouts for AI/OCR processing (default 10s is too short)
      - SERVER_READ_TIMEOUT=300
      - SERVER_WRITE_TIMEOUT=300
      - SERVER_IDLE_TIMEOUT=300
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/google-vision-credentials.json
      - FIREBASE_CREDENTIALS_PATH=/app/config/firebase/service-account.json
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # OpenAI ChatGPT Configuration (PRIMARY for OCR image extraction)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # FOMOA AI Configuration (FALLBACK 1 for brand matching)
      - FOMOA_API_KEY=${FOMOA_API_KEY}
      - FOMOA_API_URL=${FOMOA_API_URL}
      - FOMOA_MODEL=${FOMOA_MODEL}
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      - KAFKA_ENABLED=${KAFKA_ENABLED:-false}
      - GOMAXPROCS=2
      - DB_MAX_OPEN_CONNS=25
      - DB_MAX_IDLE_CONNS=10
      - DB_CONN_MAX_LIFETIME=1h
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    networks:
      - liquorpro-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8092/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G
          pids: 256
        reservations:
          cpus: '0.5'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    # read_only removed - sales service needs to write uploaded images
    tmpfs:
      - /tmp
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        compress: "true"

  inventory:
    build:
      context: .
      dockerfile: Dockerfile.inventory
      args:
        - BUILD_DATE=${BUILD_DATE}
        - VERSION=${VERSION}
        - GIT_COMMIT=${GIT_COMMIT}
    image: liquorpro/inventory:${VERSION:-latest}
    container_name: liquorpro-inventory-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:8093:8093"
    environment:
      - APP_ENVIRONMENT=production
      - SERVER_HOST=0.0.0.0
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SAAS_SERVICE_URL=http://saas:8095
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      - KAFKA_ENABLED=${KAFKA_ENABLED:-false}
      - GOMAXPROCS=1
      - DB_MAX_OPEN_CONNS=25
      - DB_MAX_IDLE_CONNS=10
      - DB_CONN_MAX_LIFETIME=1h
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    networks:
      - liquorpro-network
    volumes:
      - /opt/liquorpro/logs/inventory:/var/log/liquorpro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8093/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
          pids: 256
        reservations:
          cpus: '0.25'
          memory: 128M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        compress: "true"

  finance:
    build:
      context: .
      dockerfile: Dockerfile.finance
      args:
        - BUILD_DATE=${BUILD_DATE}
        - VERSION=${VERSION}
        - GIT_COMMIT=${GIT_COMMIT}
    image: liquorpro/finance:${VERSION:-latest}
    container_name: liquorpro-finance-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:8094:8094"
    environment:
      - APP_ENVIRONMENT=production
      - SERVER_HOST=0.0.0.0
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - FIREBASE_CREDENTIALS_PATH=/app/config/firebase/service-account.json
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      - KAFKA_ENABLED=${KAFKA_ENABLED:-false}
      - GOMAXPROCS=1
      - TZ=Asia/Kolkata
      - DB_MAX_OPEN_CONNS=25
      - DB_MAX_IDLE_CONNS=10
      - DB_CONN_MAX_LIFETIME=1h
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    networks:
      - liquorpro-network
    volumes:
      - /opt/liquorpro/logs/finance:/var/log/liquorpro
      - /opt/liquorpro/config/firebase:/app/config/firebase:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8094/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
          pids: 256
        reservations:
          cpus: '0.25'
          memory: 128M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        compress: "true"

  saas:
    build:
      context: .
      dockerfile: Dockerfile.saas
      args:
        - BUILD_DATE=${BUILD_DATE}
        - VERSION=${VERSION}
        - GIT_COMMIT=${GIT_COMMIT}
    image: liquorpro/saas:${VERSION:-latest}
    container_name: liquorpro-saas-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:8095:8095"
    environment:
      - APP_ENVIRONMENT=production
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      - KAFKA_ENABLED=${KAFKA_ENABLED:-false}
      - GOMAXPROCS=1
      - DB_MAX_OPEN_CONNS=25
      - DB_MAX_IDLE_CONNS=10
      - DB_CONN_MAX_LIFETIME=1h
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - liquorpro-network
    volumes:
      - /opt/liquorpro/logs/saas:/var/log/liquorpro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8095/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 256
        reservations:
          cpus: '0.25'
          memory: 128M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        compress: "true"

  # ========================================
  # Kafka (KRaft mode, single node)
  # ========================================

  kafka:
    image: apache/kafka:3.9.0
    container_name: liquorpro-kafka-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      # KRaft mode (built-in, no ZooKeeper)
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      # Listeners
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      # Topic defaults
      - KAFKA_NUM_PARTITIONS=3
      - KAFKA_DEFAULT_REPLICATION_FACTOR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
      # Retention
      - KAFKA_LOG_RETENTION_HOURS=168
      - KAFKA_LOG_RETENTION_BYTES=5368709120
      - KAFKA_LOG_SEGMENT_BYTES=1073741824
      # Compression
      - KAFKA_COMPRESSION_TYPE=snappy
      # JVM heap
      - KAFKA_HEAP_OPTS=-Xmx512m -Xms512m
      # Cluster ID for KRaft
      - CLUSTER_ID=liquorpro-kafka-cluster-01
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    networks:
      - liquorpro-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
          pids: 512
        reservations:
          cpus: '0.25'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"

# ========================================
# Volumes
# ========================================
volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/liquorpro/data/postgres
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/liquorpro/data/redis
  kafka_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/liquorpro/data/kafka

# ========================================
# Networks
# ========================================
networks:
  liquorpro-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
    driver_opts:
      com.docker.network.bridge.name: br-liquorpro
