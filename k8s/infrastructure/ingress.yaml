apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: liquorpro-ingress
  namespace: liquorpro
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/client-body-buffer-size: "1m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"
    nginx.ingress.kubernetes.io/proxy-buffering: "on"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,X-Tenant-ID,X-User-ID"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/rate-limit-connections: "10"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    external-dns.alpha.kubernetes.io/hostname: "api.liquorpro.com"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.liquorpro.com
    - admin.liquorpro.com
    - grafana.liquorpro.com
    secretName: liquorpro-tls-secret
  rules:
  - host: api.liquorpro.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gateway
            port:
              number: 8090
  - host: admin.liquorpro.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: saas
            port:
              number: 8095
  - host: grafana.liquorpro.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring-ingress
  namespace: liquorpro-monitoring
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: monitoring-auth
    nginx.ingress.kubernetes.io/auth-realm: 'Authentication Required - LiquorPro Monitoring'
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - prometheus.liquorpro.com
    - jaeger.liquorpro.com
    secretName: monitoring-tls-secret
  rules:
  - host: prometheus.liquorpro.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: prometheus
            port:
              number: 9090
  - host: jaeger.liquorpro.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jaeger-query
            port:
              number: 16686
---
apiVersion: v1
kind: Secret
metadata:
  name: monitoring-auth
  namespace: liquorpro-monitoring
type: Opaque
data:
  auth: YWRtaW46JGFwcjEkSDZ1aThHQnIkSkUxUEF1bldUOWZWOVNOLkdGaTJELg== # admin:liquorpro123
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: liquorpro-network-policy
  namespace: liquorpro
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: istio-system
    - namespaceSelector:
        matchLabels:
          name: liquorpro-monitoring
    - namespaceSelector:
        matchLabels:
          name: liquorpro
    ports:
    - protocol: TCP
      port: 8090
    - protocol: TCP
      port: 8091
    - protocol: TCP
      port: 8092
    - protocol: TCP
      port: 8093
    - protocol: TCP
      port: 8094
    - protocol: TCP
      port: 8095
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: liquorpro
    - namespaceSelector:
        matchLabels:
          name: liquorpro-kafka
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 9092
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-network-policy
  namespace: liquorpro
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          tier: service
    - podSelector:
        matchLabels:
          tier: api
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-network-policy
  namespace: liquorpro
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          tier: service
    - podSelector:
        matchLabels:
          tier: api
    ports:
    - protocol: TCP
      port: 6379