name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  quick-checks:
    name: Quick Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze --fatal-infos

      - name: Run quick tests
        run: flutter test test/unit/ || true

  size-check:
    name: APK Size Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Check APK size
        run: |
          APK_SIZE=$(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1)
          echo "APK Size: $APK_SIZE"

          # Fail if APK > 100MB
          APK_BYTES=$(du -b build/app/outputs/flutter-apk/app-release.apk | cut -f1)
          MAX_SIZE=104857600  # 100MB in bytes

          if [ $APK_BYTES -gt $MAX_SIZE ]; then
            echo "❌ APK size exceeds 100MB limit!"
            exit 1
          else
            echo "✅ APK size within limits ($APK_SIZE)"
          fi

  comment-pr:
    name: Comment on PR
    runs-on: ubuntu-latest
    needs: [quick-checks]
    if: always()

    steps:
      - name: Comment PR
        uses: actions/github-script@v6
        with:
          script: |
            const status = '${{ needs.quick-checks.result }}';
            const message = status === 'success'
              ? '✅ All checks passed! Ready for review.'
              : '❌ Some checks failed. Please review the logs.';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
