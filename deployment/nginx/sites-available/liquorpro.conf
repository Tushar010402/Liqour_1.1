# LiquorPro Production Site Configuration
# Reverse Proxy with Load Balancing and Health Checks

# Upstream definitions for all microservices
# Backend services run on Docker internal network

upstream gateway_backend {
    least_conn;  # Load balancing algorithm
    keepalive 32;  # Connection pooling

    server 127.0.0.1:8090 max_fails=3 fail_timeout=30s;
    # Add more instances for horizontal scaling:
    # server 127.0.0.1:8090;
    # server 127.0.0.1:8190;
    # server 127.0.0.1:8290;
}

upstream auth_backend {
    least_conn;
    keepalive 16;

    server 127.0.0.1:8091 max_fails=3 fail_timeout=30s;
}

upstream sales_backend {
    least_conn;
    keepalive 16;

    server 127.0.0.1:8092 max_fails=3 fail_timeout=30s;
}

upstream inventory_backend {
    least_conn;
    keepalive 16;

    server 127.0.0.1:8093 max_fails=3 fail_timeout=30s;
}

upstream finance_backend {
    least_conn;
    keepalive 16;

    server 127.0.0.1:8094 max_fails=3 fail_timeout=30s;
}

upstream frontend_backend {
    least_conn;
    keepalive 16;

    server 127.0.0.1:8095 max_fails=3 fail_timeout=30s;
}

# HTTP to HTTPS redirect
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name new.v2.floelife.in;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name new.v2.floelife.in;

    # SSL Certificate paths
    ssl_certificate /etc/letsencrypt/live/new.v2.floelife.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new.v2.floelife.in/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/new.v2.floelife.in/chain.pem;

    # SSL configuration (main settings in nginx.conf)

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Rate limiting (disabled temporarily - will enable after testing)
    # limit_req zone=general_limit burst=50 nodelay;
    # limit_conn conn_limit 20;

    # Access and error logs
    access_log /opt/liquorpro/logs/nginx/access.log combined;
    error_log /opt/liquorpro/logs/nginx/error.log warn;

    # Root location - health check
    location / {
        return 200 'LiquorPro API Gateway - Production\n';
        add_header Content-Type text/plain;
    }

    # Gateway API - Main API endpoint
    location /gateway/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://gateway_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Auth Service
    location /auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://auth_backend/auth/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sales Service
    location /sales/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://sales_backend/sales/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # OCR image uploads need longer timeout
        proxy_read_timeout 60s;
        client_max_body_size 50m;
    }

    # Inventory Service
    location /inventory/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://inventory_backend/inventory/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Finance Service
    location /finance/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://finance_backend/finance/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend Service (HTML/Bootstrap UI)
    location / {
        limit_req zone=general_limit burst=50 nodelay;

        proxy_pass http://frontend_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Static assets caching
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://frontend_backend;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # WebSocket endpoint for real-time features
    location /ws {
        proxy_pass http://gateway_backend/ws;

        # WebSocket specific headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_read_timeout 3600s;  # 1 hour
        proxy_send_timeout 3600s;

        # No buffering for WebSocket
        proxy_buffering off;
    }

    # GraphQL endpoint
    location /api/graphql {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://gateway_backend/api/graphql;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # GraphQL might have complex queries
        proxy_read_timeout 60s;
    }

    # Health check endpoint (no rate limiting)
    location /health {
        access_log off;  # Don't log health checks
        proxy_pass http://gateway_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Metrics endpoint (Prometheus)
    location /metrics {
        access_log off;

        # Restrict to local network or specific IPs
        allow 127.0.0.1;
        allow 172.20.0.0/16;  # Docker network
        deny all;

        proxy_pass http://gateway_backend/metrics;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Grafana (if hosted on same server)
    location /grafana/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Security: Deny access to sensitive files
    location ~ \.(sql|env|config|ini|log|bak|old)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
