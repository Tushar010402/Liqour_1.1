database:
  host: localhost
  port: 5432
  user: liquorpro
  password: liquorpro_password
  dbname: liquorpro
  sslmode: disable
  timezone: UTC
  driver: postgres

redis:
  host: localhost
  port: 6379
  password: redis_password
  db: 0

jwt:
  secret: your-super-secret-jwt-key-change-in-production

cors:
  allowed_origins:
    - "*"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
    - "PATCH"
  allowed_headers:
    - "*"
  expose_headers:
    - "Content-Length"
    - "Authorization"
  allow_credentials: false
  max_age: 3600

razorpay:
  key_id: ""
  key_secret: ""
  webhook_secret: ""