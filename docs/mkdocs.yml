    - Features: product/features.md
    - Roadmap: product/roadmap.md
    - Release Notes: product/release-notes.md
  - Workflows:
    - Sales Workflow: workflows/sales-workflow.md
    - Approval Workflow: workflows/approval-workflow.md
    - Inventory Workflow: workflows/inventory-workflow.md
    - Finance Workflow: workflows/finance-workflow.md
    - OCR Processing: workflows/ocr-workflow.md
  - API Reference:
    - Authentication API: api-reference/auth-api.md
    - Sales API: api-reference/sales-api.md
    - Inventory API: api-reference/inventory-api.md
    - Finance API: api-reference/finance-api.md
    - WebSocket API: api-reference/websocket-api.md
  - Deployment:
    - Installation Guide: deployment/installation.md
    - Configuration: deployment/configuration.md
    - Docker Deployment: deployment/docker.md
    - Kubernetes: deployment/kubernetes.md
    - Monitoring: deployment/monitoring.md
  - Development:
    - Module Architecture: development/module-architecture.md
    - Implementation Checklist: development/implementation-checklist.md
    - Module Specifications:
      - Core Module: development/modules/core-module.md
      - Auth Module: development/modules/auth-module.md
      - Tenant Module: development/modules/tenant-module.md
      - Sales Module: development/modules/sales-module.md
      - Inventory Module: development/modules/inventory-module.md
      - Finance Module: development/modules/finance-module.md
      - Reports Module: development/modules/reports-module.md
      - Integration Module: development/modules/integration-module.md
      - Collaboration Module: development/modules/collaboration-module.md

