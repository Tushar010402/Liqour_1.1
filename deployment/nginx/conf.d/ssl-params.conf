# SSL/TLS Parameters for Production
# Optimized for Security and Performance (A+ Rating on SSLLabs)

# SSL Protocol versions (only TLS 1.2 and 1.3)
ssl_protocols TLSv1.2 TLSv1.3;

# Prefer server ciphers
ssl_prefer_server_ciphers on;

# Strong cipher suites (excludes weak ciphers)
ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256';

# Diffie-Hellman parameter for DHE ciphersuites (4096 bit)
# Generate with: openssl dhparam -out /etc/nginx/dhparam.pem 4096
ssl_dhparam /etc/nginx/dhparam.pem;

# SSL session caching (improves performance for repeat connections)
ssl_session_cache shared:SSL:50m;
ssl_session_timeout 1d;
ssl_session_tickets off;  # Disable for Perfect Forward Secrecy

# OCSP Stapling (improves SSL/TLS performance and privacy)
ssl_stapling on;
ssl_stapling_verify on;

# DNS resolvers for OCSP stapling
resolver 8.8.8.8 8.8.4.4 1.1.1.1 valid=300s;
resolver_timeout 5s;

# SSL buffer size (optimize for lower latency)
ssl_buffer_size 4k;

# TLS 1.3 early data (0-RTT) - Disabled for security
ssl_early_data off;
