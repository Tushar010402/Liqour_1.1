# Nginx configuration for LiquorPro Documentation
# Place this in /etc/nginx/sites-available/liquorpro-docs

server {
    listen 80;
    server_name docs.liquorpro.io;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name docs.liquorpro.io;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/docs.liquorpro.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.liquorpro.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Root directory (after mkdocs build)
    root /var/www/liquorpro/docs/site;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Main location
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Error pages
    error_page 404 /404.html;
}
