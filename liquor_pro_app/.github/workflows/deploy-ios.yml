name: Deploy iOS

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    name: Deploy to TestFlight
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS
        run: |
          flutter build ios --release \
            --obfuscate \
            --split-debug-info=build/ios/outputs/symbols \
            --tree-shake-icons

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Archive & Export IPA
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
        run: |
          cd ios
          # Note: Requires Fastlane setup
          # fastlane beta

      - name: Upload to TestFlight
        run: |
          # Note: Requires proper certificates and provisioning profiles
          # xcrun altool --upload-app \
          #   --type ios \
          #   --file "ios/build/Runner.ipa" \
          #   --username "${{ secrets.APPLE_ID }}" \
          #   --password "${{ secrets.APP_SPECIFIC_PASSWORD }}"
          echo "iOS deployment requires manual Xcode setup"
          echo "See CICD_PIPELINE_SETUP.md for detailed instructions"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body: |
            ## LiquorPro App iOS Release ${{ github.ref_name }}

            ### What's New
            - See changelog for details

            ### Build Info
            - Flutter Version: 3.19.0
            - Build Date: ${{ github.event.head_commit.timestamp }}
            - Commit: ${{ github.sha }}

            ### Installation
            Available on TestFlight
