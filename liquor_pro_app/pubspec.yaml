name: liquor_pro_app
description: "LiquorPro - Professional Multi-Tenant Liquor Management System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9

  # State Management
  provider: ^6.1.1

  # Navigation
  go_router: ^13.0.0

  # HTTP & API
  http: ^1.2.0
  dio: ^5.4.0

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3
  logger: ^2.0.2+1

  # Image Handling
  cached_network_image: ^3.3.1

  # Charts & Analytics
  fl_chart: ^0.66.0

  # Form Validation
  form_field_validator: ^1.1.0

  # OTP Input
  pin_code_fields: ^8.0.1

  # Loading & Progress
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.0

  # Responsive Design
  responsive_builder: ^0.7.0

  # Pull to Refresh
  pull_to_refresh: ^2.0.0

  # Modern UI Libraries
  flutter_animate: ^4.5.0
  get_it: ^7.6.7
  flutter_slidable: ^3.0.1
  animations: ^2.0.11
  flutter_staggered_grid_view: ^0.7.0
  badges: ^3.1.2
  flutter_rating_bar: ^4.0.1
  expandable: ^5.0.1
  animate_do: ^3.3.4
  card_swiper: ^3.0.1
  flutter_card_swiper: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

