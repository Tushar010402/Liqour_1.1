org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Set Java home to use installed Java 17 (required for AGP 8.1.4+)
org.gradle.java.home=/usr/local/Cellar/openjdk@17/17.0.17/libexec/openjdk.jdk/Contents/Home

# Build stability — daemon crashes on some machines, disable it
org.gradle.daemon=false
org.gradle.caching=false
org.gradle.parallel=false
org.gradle.configureondemand=false

# Fix for Gradle cache corruption and network issues
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
org.gradle.vfs.watch=false
org.gradle.unsafe.configuration-cache=false
