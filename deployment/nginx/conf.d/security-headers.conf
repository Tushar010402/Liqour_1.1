# Security Headers for Production
# Protects against common web vulnerabilities (OWASP recommendations)

# HTTP Strict Transport Security (HSTS)
# Enforces HTTPS for 1 year, including subdomains
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# X-Frame-Options - Prevents clickjacking attacks
add_header X-Frame-Options "DENY" always;

# X-Content-Type-Options - Prevents MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;

# X-XSS-Protection - Enables Cross-Site Scripting filter
add_header X-XSS-Protection "1; mode=block" always;

# Content Security Policy (CSP) - Restricts resource loading
# Adjust this based on your frontend requirements
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

# Referrer Policy - Controls referrer information
add_header Referrer-Policy "no-referrer-when-downgrade" always;

# Permissions Policy (formerly Feature Policy)
# Restricts browser features that the site can use
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

# X-Permitted-Cross-Domain-Policies - Restricts cross-domain policy files
add_header X-Permitted-Cross-Domain-Policies "none" always;

# Cross-Origin-Embedder-Policy (COEP)
add_header Cross-Origin-Embedder-Policy "require-corp" always;

# Cross-Origin-Opener-Policy (COOP)
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Cross-Origin-Resource-Policy (CORP)
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Remove Server header (already done in nginx.conf with server_tokens off)
# But add our custom server header
add_header X-Server-ID "LiquorPro-Gateway" always;

# Add custom security header for API versioning
add_header X-API-Version "1.0.0" always;

# Expect-CT header - Certificate Transparency
add_header Expect-CT "max-age=86400, enforce" always;
