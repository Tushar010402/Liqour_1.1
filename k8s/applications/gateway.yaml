apiVersion: v1
kind: Secret
metadata:
  name: liquorpro-secret
  namespace: liquorpro
type: Opaque
data:
  DATABASE_HOST: cG9zdGdyZXM= # postgres
  DATABASE_PORT: NTQzMg== # 5432
  DATABASE_USER: bGlxdW9ycHJv # liquorpro
  DATABASE_PASSWORD: bGlxdW9ycHJvX3Bhc3N3b3Jk # liquorpro_password
  DATABASE_NAME: bGlxdW9ycHJv # liquorpro
  REDIS_HOST: cmVkaXM= # redis
  REDIS_PORT: NjM3OQ== # 6379
  REDIS_PASSWORD: cmVkaXNfcGFzc3dvcmQ= # redis_password
  JWT_SECRET: eW91ci1zdXBlci1zZWNyZXQtand0LWtleS1jaGFuZ2UtaW4tcHJvZHVjdGlvbg== # your-super-secret-jwt-key-change-in-production
  KAFKA_BROKERS: a2Fma2EubGlxdW9ycHJvLWthZmthLnN2Yy5jbHVzdGVyLmxvY2FsOjkwOTI= # kafka.liquorpro-kafka.svc.cluster.local:9092
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: liquorpro
data:
  config.yaml: |
    server:
      host: "0.0.0.0"
      port: 8090
      mode: "release"
      read_timeout: 10
      write_timeout: 10
      idle_timeout: 120

    database:
      host: postgres
      port: 5432
      user: liquorpro
      password: liquorpro_password
      dbname: liquorpro
      sslmode: disable
      timezone: UTC

    redis:
      host: redis
      port: 6379
      password: redis_password
      db: 0

    jwt:
      secret: your-super-secret-jwt-key-change-in-production
      expiration_hours: 24
      refresh_hours: 168
      issuer: liquorpro

    app:
      name: LiquorPro
      version: "1.0.0"
      environment: production
      debug: false
      log_level: info

    services:
      auth:
        host: auth
        port: 8091
        url: http://auth.liquorpro.svc.cluster.local:8091
      sales:
        host: sales
        port: 8092
        url: http://sales.liquorpro.svc.cluster.local:8092
      inventory:
        host: inventory
        port: 8093
        url: http://inventory.liquorpro.svc.cluster.local:8093
      finance:
        host: finance
        port: 8094
        url: http://finance.liquorpro.svc.cluster.local:8094
      saas:
        host: saas
        port: 8095
        url: http://saas.liquorpro.svc.cluster.local:8095

    kafka:
      brokers:
        - kafka.liquorpro-kafka.svc.cluster.local:9092
      group_id: gateway-service
      batch_size: 100
      batch_timeout: 1000
      retry_attempts: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: liquorpro
  labels:
    app: gateway
    tier: api
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: gateway
      version: v1
  template:
    metadata:
      labels:
        app: gateway
        tier: api
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: gateway
        image: liquorpro/gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8090
          name: http
          protocol: TCP
        env:
        - name: APP_ENVIRONMENT
          value: "production"
        - name: DATABASE_HOST
          valueFrom:
            secretKeyRef:
              name: liquorpro-secret
              key: DATABASE_HOST
        - name: DATABASE_PORT
          valueFrom:
            secretKeyRef:
              name: liquorpro-secret
              key: DATABASE_PORT
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: liquorpro-secret
              key: DATABASE_USER
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: liquorpro-secret
              key: DATABASE_PASSWORD
        - name: DATABASE_NAME
          valueFrom:
            secretKeyRef:
              name: liquorpro-secret
              key: DATABASE_NAME
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: liquorpro-secret
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: liquorpro-secret
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: liquorpro-secret
              key: REDIS_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: liquorpro-secret
              key: JWT_SECRET
        - name: KAFKA_BROKERS
          valueFrom:
            secretKeyRef:
              name: liquorpro-secret
              key: KAFKA_BROKERS
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: 8090
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8090
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config
        configMap:
          name: gateway-config
      securityContext:
        fsGroup: 1000
      serviceAccountName: liquorpro-sa
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: liquorpro
  labels:
    app: gateway
    tier: api
spec:
  ports:
  - port: 8090
    targetPort: 8090
    name: http
    protocol: TCP
  selector:
    app: gateway
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-hpa
  namespace: liquorpro
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 4
        periodSeconds: 15
      selectPolicy: Max