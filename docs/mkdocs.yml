    - Quick Start: product-guide/quick-start.md
    - Feature Tour: product-guide/feature-tour.md
    - FAQ: product-guide/faq.md
  - System Architecture:
    - Overview: system/overview.md
    - Infrastructure: system/infrastructure.md
    - Security: system/security.md
    - Scalability: system/scalability.md
  - Software Specification:
    - Technical Specification: software/technical-spec.md
    - Database Design: software/database-design.md
    - API Design: software/api-design.md
    - Technology Stack: software/technology-stack.md
  - User Guide:
    - Getting Started: user-guide/getting-started.md
    - Role Journeys: user-guide/role-journeys.md
    - Daily Operations: user-guide/daily-operations.md
    - Sales Management: user-guide/sales-management.md
    - Inventory Management: user-guide/inventory-management.md
    - Finance Management: user-guide/finance-management.md
    - Reports & Analytics: user-guide/reports.md
    - Troubleshooting: user-guide/troubleshooting.md
  - Product Documentation:
