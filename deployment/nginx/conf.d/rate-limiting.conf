# Rate Limiting Configuration
# Protects against DDoS, brute force attacks, and API abuse

# Define rate limiting zones (already defined in nginx.conf)
# These are referenced here for documentation

# Zone: api_limit
# Purpose: General API endpoints
# Rate: 100 requests per minute per IP
# Size: 10MB memory
# Usage: limit_req zone=api_limit burst=20 nodelay;

# Zone: auth_limit
# Purpose: Authentication endpoints (login, OTP, register)
# Rate: 20 requests per minute per IP (stricter for security)
# Size: 10MB memory
# Usage: limit_req zone=auth_limit burst=10 nodelay;

# Zone: general_limit
# Purpose: General web traffic
# Rate: 200 requests per minute per IP
# Size: 10MB memory
# Usage: limit_req zone=general_limit burst=50 nodelay;

# Zone: conn_limit
# Purpose: Concurrent connection limit
# Limit: 20 concurrent connections per IP
# Size: 10MB memory
# Usage: limit_conn conn_limit 20;

# Custom error pages for rate limiting
limit_req_status 429;  # Too Many Requests
limit_conn_status 429;

# Log rate limit violations
limit_req_log_level warn;
limit_conn_log_level warn;

# Map to whitelist IPs from rate limiting
# Uncomment and add your trusted IPs
# geo $limit_key {
#     default $binary_remote_addr;
#     127.0.0.1 "";  # Localhost
#     10.0.0.0/8 "";  # Internal network
#     172.16.0.0/12 "";  # Docker network
# }

