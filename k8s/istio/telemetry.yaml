apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:
  name: liquorpro-telemetry
  namespace: liquorpro
spec:
  metrics:
  - providers:
    - name: prometheus
  - overrides:
    - match:
        metric: ALL_METRICS
      tagOverrides:
        source_service_name:
          value: "%{SOURCE_SERVICE_NAME | 'unknown'}"
        source_service_namespace:
          value: "%{SOURCE_SERVICE_NAMESPACE | 'unknown'}"
        destination_service_name:
          value: "%{DESTINATION_SERVICE_NAME | 'unknown'}"
        destination_service_namespace:
          value: "%{DESTINATION_SERVICE_NAMESPACE | 'unknown'}"
---
apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:
  name: access-logging
  namespace: liquorpro
spec:
  accessLogging:
  - providers:
    - name: otel
---
apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:
  name: tracing
  namespace: liquorpro
spec:
  tracing:
  - providers:
    - name: jaeger
  - customTags:
      tenant_id:
        header:
          name: "x-tenant-id"
      user_id:
        header:
          name: "x-user-id"
      request_id:
        header:
          name: "x-request-id"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: istio-telemetry-config
  namespace: istio-system
data:
  mesh: |
    defaultConfig:
      proxyStatsMatcher:
        inclusionRegexps:
        - ".*outlier_detection.*"
        - ".*circuit_breakers.*"
        - ".*upstream_rq_retry.*"
        - ".*upstream_rq_pending.*"
        - ".*_cx_.*"
        exclusionRegexps:
        - ".*osconfig.*"
    extensionProviders:
    - name: prometheus
      prometheus:
        configOverride:
          metric_relabeling_configs:
          - source_labels: [__name__]
            regex: 'istio_.*'
            target_label: __tmp_istio_metric
          - source_labels: [__tmp_istio_metric, source_service_name]
            regex: 'istio_request_total;(.*)'
            target_label: source_service
            replacement: '${1}'
    - name: jaeger
      envoyOtelAls:
        service: jaeger-collector.liquorpro-monitoring.svc.cluster.local
        port: 14250
    - name: otel
      envoyOtelAls:
        service: opentelemetry-collector.liquorpro-monitoring.svc.cluster.local
        port: 4317