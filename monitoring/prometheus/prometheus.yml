global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ['localhost:9090']

  # LiquorPro Gateway
  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:8090']
    metrics_path: /metrics
    scrape_interval: 10s

  # Auth Service
  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth:8091']
    metrics_path: /metrics
    scrape_interval: 10s

  # Sales Service
  - job_name: 'sales-service'
    static_configs:
      - targets: ['sales:8092']
    metrics_path: /metrics
    scrape_interval: 10s

  # Inventory Service
  - job_name: 'inventory-service'
    static_configs:
      - targets: ['inventory:8093']
    metrics_path: /metrics
    scrape_interval: 10s

  # Finance Service
  - job_name: 'finance-service'
    static_configs:
      - targets: ['finance:8094']
    metrics_path: /metrics
    scrape_interval: 10s

  # SaaS Service
  - job_name: 'saas-service'
    static_configs:
      - targets: ['saas:8095']
    metrics_path: /metrics
    scrape_interval: 10s

  # System metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 10s

  # Database metrics
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 10s

  # Redis metrics
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 10s
