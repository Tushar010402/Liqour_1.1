global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      repeat_interval: 1h
      receiver: 'critical'
    - match:
        severity: warning
      repeat_interval: 4h
      receiver: 'default'

receivers:
  - name: 'default'
    # Configure Slack/email later:
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/xxx'
    #     channel: '#liquorpro-alerts'
    #     send_resolved: true

  - name: 'critical'
    # Configure Slack/email later:
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/xxx'
    #     channel: '#liquorpro-critical'
    #     send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
