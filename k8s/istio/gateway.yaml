apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: liquorpro-gateway
  namespace: liquorpro
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - api.liquorpro.com
    - "*.liquorpro.com"
    tls:
      httpsRedirect: true
  - port:
      number: 443
      name: https
      protocol: HTTPS
    tls:
      mode: SIMPLE
      credentialName: liquorpro-tls-secret
    hosts:
    - api.liquorpro.com
    - "*.liquorpro.com"
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: liquorpro-vs
  namespace: liquorpro
spec:
  hosts:
  - api.liquorpro.com
  gateways:
  - liquorpro-gateway
  http:
  - match:
    - uri:
        prefix: /api/v1/auth
    route:
    - destination:
        host: auth.liquorpro.svc.cluster.local
        port:
          number: 8091
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s
  - match:
    - uri:
        prefix: /api/v1/sales
    route:
    - destination:
        host: sales.liquorpro.svc.cluster.local
        port:
          number: 8092
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s
  - match:
    - uri:
        prefix: /api/v1/inventory
    route:
    - destination:
        host: inventory.liquorpro.svc.cluster.local
        port:
          number: 8093
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s
  - match:
    - uri:
        prefix: /api/v1/finance
    route:
    - destination:
        host: finance.liquorpro.svc.cluster.local
        port:
          number: 8094
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s
  - match:
    - uri:
        prefix: /api/v1/saas
    route:
    - destination:
        host: saas.liquorpro.svc.cluster.local
        port:
          number: 8095
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: gateway.liquorpro.svc.cluster.local
        port:
          number: 8090
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: liquorpro-dr
  namespace: liquorpro
spec:
  host: "*.liquorpro.svc.cluster.local"
  trafficPolicy:
    loadBalancer:
      simple: LEAST_CONN
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 100
        maxRequestsPerConnection: 10
        maxRetries: 3
        consecutiveGatewayErrors: 5
        interval: 30s
        baseEjectionTime: 30s
    outlierDetection:
      consecutiveGatewayErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: gateway-dr
  namespace: liquorpro
spec:
  host: gateway.liquorpro.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
    connectionPool:
      tcp:
        maxConnections: 200
      http:
        http1MaxPendingRequests: 200
        maxRequestsPerConnection: 20
        maxRetries: 3
    outlierDetection:
      consecutiveGatewayErrors: 3
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 30
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: auth-dr
  namespace: liquorpro
spec:
  host: auth.liquorpro.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      simple: LEAST_CONN
    connectionPool:
      tcp:
        maxConnections: 50
      http:
        http1MaxPendingRequests: 50
        maxRequestsPerConnection: 10
        maxRetries: 3
    outlierDetection:
      consecutiveGatewayErrors: 5
      interval: 30s
      baseEjectionTime: 30s