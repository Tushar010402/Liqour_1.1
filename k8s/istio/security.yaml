apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: liquorpro
spec:
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: liquorpro-authz
  namespace: liquorpro
spec:
  selector:
    matchLabels:
      app: gateway
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"]
  - to:
    - operation:
        methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS"]
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: service-to-service-authz
  namespace: liquorpro
spec:
  rules:
  - from:
    - source:
        namespaces: ["liquorpro"]
  - to:
    - operation:
        methods: ["GET", "POST", "PUT", "DELETE", "PATCH"]
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: database-access-policy
  namespace: liquorpro
spec:
  selector:
    matchLabels:
      app: postgres
  rules:
  - from:
    - source:
        principals:
        - "cluster.local/ns/liquorpro/sa/liquorpro-sa"
  - to:
    - operation:
        ports: ["5432"]
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: redis-access-policy
  namespace: liquorpro
spec:
  selector:
    matchLabels:
      app: redis
  rules:
  - from:
    - source:
        principals:
        - "cluster.local/ns/liquorpro/sa/liquorpro-sa"
  - to:
    - operation:
        ports: ["6379"]
---
apiVersion: security.istio.io/v1beta1
kind: RequestAuthentication
metadata:
  name: jwt-auth
  namespace: liquorpro
spec:
  selector:
    matchLabels:
      tier: api
  jwtRules:
  - issuer: "liquorpro"
    jwksUri: "http://auth.liquorpro.svc.cluster.local:8091/.well-known/jwks.json"
    forwardOriginalToken: true
---
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: external-apis
  namespace: liquorpro
spec:
  hosts:
  - razorpay.com
  - api.razorpay.com
  ports:
  - number: 443
    name: https
    protocol: HTTPS
  - number: 80
    name: http
    protocol: HTTP
  location: MESH_EXTERNAL
  resolution: DNS