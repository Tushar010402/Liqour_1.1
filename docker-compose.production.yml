version: '3.8'

# LiquorPro Production Docker Compose
# Optimized for high performance, security, and reliability
# Server: 72.60.96.174

services:
  # ========================================
  # Database Services
  # ========================================

  postgres:
    image: postgres:15-alpine
    container_name: liquorpro-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_MULTIPLE_EXTENSIONS: uuid-ossp,pg_trgm
      # Performance tuning
      POSTGRES_SHARED_BUFFERS: 2GB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 6GB
      POSTGRES_MAX_CONNECTIONS: 300
      POSTGRES_WORK_MEM: 16MB
    ports:
      - "127.0.0.1:5432:5432"  # Bind to localhost only
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - /opt/liquorpro/logs/postgres:/var/log/postgresql
    networks:
      - liquorpro-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        compress: "true"

  redis:
    image: redis:7-alpine
    container_name: liquorpro-redis-prod
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --appendonly yes
      --appendfsync everysec
    ports:
      - "127.0.0.1:6379:6379"  # Bind to localhost only
    volumes:
      - redis_data:/data
      - /opt/liquorpro/logs/redis:/var/log/redis
    networks:
      - liquorpro-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        compress: "true"

  # ========================================
  # Database Migrations (runs first)
  # ========================================

  migrations:
    build:
      context: .
      dockerfile: Dockerfile.migrations
    image: liquorpro/migrations:${VERSION:-latest}
    container_name: liquorpro-migrations-prod
    restart: "no"  # Run once only
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - liquorpro-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================
  # Microservices
  # ========================================

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
      args:
        - BUILD_DATE=${BUILD_DATE}
        - VERSION=${VERSION}
        - GIT_COMMIT=${GIT_COMMIT}
    image: liquorpro/gateway:${VERSION:-latest}
    container_name: liquorpro-gateway-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"  # Bind to localhost only
    environment:
      - APP_ENVIRONMENT=production
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SERVICES_AUTH_URL=http://auth:8091
      - SERVICES_SALES_URL=http://sales:8092
      - SERVICES_INVENTORY_URL=http://inventory:8093
      - SERVICES_FINANCE_URL=http://finance:8094
      - SERVICES_SAAS_URL=http://saas:8095
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      - KAFKA_ENABLED=${KAFKA_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - liquorpro-network
    volumes:
      - /opt/liquorpro/logs/gateway:/var/log/liquorpro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        compress: "true"

  auth:
    build:
      context: .
      dockerfile: Dockerfile.auth
      args:
        - BUILD_DATE=${BUILD_DATE}
        - VERSION=${VERSION}
        - GIT_COMMIT=${GIT_COMMIT}
    image: liquorpro/auth:${VERSION:-latest}
    container_name: liquorpro-auth-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      - APP_ENVIRONMENT=production
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - liquorpro-network
    volumes:
      - /opt/liquorpro/logs/auth:/var/log/liquorpro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8091/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        compress: "true"

  sales:
    build:
      context: .
      dockerfile: Dockerfile.sales
      args:
        - BUILD_DATE=${BUILD_DATE}
        - VERSION=${VERSION}
        - GIT_COMMIT=${GIT_COMMIT}
    image: liquorpro/sales:${VERSION:-latest}
    container_name: liquorpro-sales-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:8092:8092"
    volumes:
      - ./credentials:/app/credentials:ro
      - /opt/liquorpro/logs/sales:/var/log/liquorpro
    environment:
      - APP_ENVIRONMENT=production
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/google-vision-credentials.json
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - liquorpro-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8092/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        compress: "true"

  inventory:
    build:
      context: .
      dockerfile: Dockerfile.inventory
      args:
        - BUILD_DATE=${BUILD_DATE}
        - VERSION=${VERSION}
        - GIT_COMMIT=${GIT_COMMIT}
    image: liquorpro/inventory:${VERSION:-latest}
    container_name: liquorpro-inventory-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:8093:8093"
    environment:
      - APP_ENVIRONMENT=production
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SAAS_SERVICE_URL=http://saas:8095
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - liquorpro-network
    volumes:
      - /opt/liquorpro/logs/inventory:/var/log/liquorpro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8093/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        compress: "true"

  finance:
    build:
      context: .
      dockerfile: Dockerfile.finance
      args:
        - BUILD_DATE=${BUILD_DATE}
        - VERSION=${VERSION}
        - GIT_COMMIT=${GIT_COMMIT}
    image: liquorpro/finance:${VERSION:-latest}
    container_name: liquorpro-finance-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:8094:8094"
    environment:
      - APP_ENVIRONMENT=production
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - liquorpro-network
    volumes:
      - /opt/liquorpro/logs/finance:/var/log/liquorpro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8094/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        compress: "true"

  saas:
    build:
      context: .
      dockerfile: Dockerfile.saas
      args:
        - BUILD_DATE=${BUILD_DATE}
        - VERSION=${VERSION}
        - GIT_COMMIT=${GIT_COMMIT}
    image: liquorpro/saas:${VERSION:-latest}
    container_name: liquorpro-saas-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:8095:8095"
    environment:
      - APP_ENVIRONMENT=production
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - liquorpro-network
    volumes:
      - /opt/liquorpro/logs/saas:/var/log/liquorpro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8095/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        compress: "true"

# ========================================
# Volumes
# ========================================
volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/liquorpro/data/postgres
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/liquorpro/data/redis

# ========================================
# Networks
# ========================================
networks:
  liquorpro-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
    driver_opts:
      com.docker.network.bridge.name: br-liquorpro
