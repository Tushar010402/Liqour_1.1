<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sale Receipt - Daily Purcha</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f0f0; padding: 10px; }
        .controls { background: #fff; padding: 15px; margin-bottom: 15px; border-radius: 8px; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; }
        .controls label { font-weight: bold; margin-right: 5px; }
        .controls select, .controls input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .controls button { background: #1976D2; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .controls button:hover { background: #1565C0; }
        .radio-group { display: flex; gap: 10px; align-items: center; }
        .radio-group label { font-weight: normal; display: flex; align-items: center; gap: 3px; }

        .page { background: white; width: 210mm; min-height: 297mm; margin: 0 auto 20px; padding: 8mm; page-break-after: always; }
        .page:last-child { page-break-after: avoid; }

        .header { text-align: center; margin-bottom: 8px; border-bottom: 2px solid #000; padding-bottom: 5px; }
        .header h1 { font-size: 16px; margin-bottom: 3px; }
        .header .shop-info { display: flex; justify-content: space-between; font-size: 12px; }

        .category-header { background: #E0E0E0; padding: 4px 8px; font-weight: bold; font-size: 13px; margin-top: 8px; border: 1px solid #000; }

        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        th { background: #1976D2; color: white; padding: 4px 2px; border: 1px solid #000; font-size: 10px; }
        td { border: 1px solid #000; padding: 3px 2px; text-align: center; height: 18px; }
        .brand-col { text-align: left; padding-left: 4px; font-weight: bold; }
        .rate-col { font-weight: bold; }
        .sno-col { width: 6%; }
        .brand-th { width: 32%; }
        .num-col { width: 8%; }
        .rate-th { width: 9%; }
        .amt-col { width: 10%; }

        .subtotal-row { background: #BBDEFB; font-weight: bold; }
        .grand-total { background: #0D47A1; color: white; font-weight: bold; }
        .blank-row td { height: 18px; }

        @media print {
            body { background: white; padding: 0; }
            .controls { display: none; }
            .page { width: 100%; margin: 0; padding: 5mm; box-shadow: none; }
            @page { size: A4 portrait; margin: 5mm; }
        }
    </style>
</head>
<body>
    <div class="controls">
        <div>
            <label>Shop:</label>
            <select id="shopSelect" onchange="renderPages()">
                <option value="fm_tower">FM Tower</option>
                <option value="mahua_khera">Mahua Khera</option>
            </select>
        </div>
        <div>
            <label>Size:</label>
            <select id="sizeSelect" onchange="renderPages()">
                <option value="all">All Sizes (Multiple Pages)</option>
                <option value="90ML">90 ML</option>
                <option value="180ML">180 ML</option>
                <option value="375ML">375 ML</option>
                <option value="750ML">750 ML</option>
                <option value="500ML">500 ML (Beer)</option>
                <option value="650ML">650 ML (Beer)</option>
            </select>
        </div>
        <div>
            <label>Filter:</label>
            <select id="categoryFilter" onchange="renderPages()">
                <option value="non_beer">Non-Beer Only</option>
                <option value="all">All Categories</option>
                <option value="beer">Beer Only</option>
            </select>
        </div>
        <div class="radio-group">
            <label>Opening:</label>
            <label><input type="radio" name="opening" value="show" checked onchange="renderPages()"> Show</label>
            <label><input type="radio" name="opening" value="hide" onchange="renderPages()"> Hide</label>
        </div>
        <div class="radio-group">
            <label>View:</label>
            <label><input type="radio" name="viewMode" value="category" checked onchange="renderPages()"> Category-wise</label>
            <label><input type="radio" name="viewMode" value="price" onchange="renderPages()"> Price-wise</label>
        </div>
        <button onclick="window.print()">🖨️ Print / Download PDF</button>
    </div>

        const CATEGORY_ORDER = ['Whisky', 'Rum', 'Vodka', 'IMFL', 'Wine', 'Brandy', 'Beer'];
        const SIZE_ORDER = ['90ML', '180ML', '375ML', '750ML', '500ML', '650ML', '1L'];

        function renderPages() {
            const shop = document.getElementById('shopSelect').value;
            const sizeFilter = document.getElementById('sizeSelect').value;
            const catFilter = document.getElementById('categoryFilter').value;
            const showOpening = document.querySelector('input[name="opening"]:checked').value === 'show';
            const viewMode = document.querySelector('input[name="viewMode"]:checked').value;

            let items = SHOP_DATA[shop].items.filter(item => {
                if (catFilter === 'non_beer') return item.category !== 'Beer';
                if (catFilter === 'beer') return item.category === 'Beer';
                return true;
            });

            const sizes = sizeFilter === 'all' ? SIZE_ORDER : [sizeFilter];
            let html = '';

            sizes.forEach(size => {
                const sizeItems = items.filter(i => i.size === size);
                if (sizeItems.length === 0) return;

                html += `<div class="page">`;
                html += `<div class="header">
                    <h1>SALE RECEIPT - ${size}</h1>
                    <div class="shop-info">
                        <span>Shop: ${SHOP_DATA[shop].name}</span>
                        <span>ओपन  रसी  टोटल</span>
                        <span>Date: ___/___/______</span>
                    </div>
                </div>`;

                if (viewMode === 'category') {
                    html += renderCategoryWise(sizeItems, showOpening);
                } else {
                    html += renderPriceWise(sizeItems, showOpening);
                }

                html += `</div>`;
            });

            document.getElementById('content').innerHTML = html || '<div class="page"><p style="text-align:center;padding:50px;">No items found for selected filters.</p></div>';
        }

        function renderCategoryWise(items, showOpening) {
            let html = '';
            let globalSno = 1;
            let grandTotal = { opening: 0 };

            CATEGORY_ORDER.forEach(cat => {
                const catItems = items.filter(i => i.category === cat).sort((a, b) => a.rate - b.rate);
                if (catItems.length === 0) return;

                html += `<div class="category-header">${cat.toUpperCase()}</div>`;
                html += `<table>
                    <tr>
                        <th class="sno-col">S.No</th>
                        <th class="brand-th">Brand Name</th>
                        <th class="num-col">Open</th>
                        <th class="num-col">Rcpt</th>
                        <th class="num-col">Total</th>
                        <th class="num-col">Sale</th>
                        <th class="rate-th">Rate</th>
                        <th class="amt-col">Amount</th>
                        <th class="num-col">Close</th>
                    </tr>`;

                let catTotal = { opening: 0 };
                catItems.forEach(item => {
                    html += `<tr>
                        <td>${globalSno++}</td>
                        <td class="brand-col">${item.brand}</td>
                        <td>${showOpening ? item.stock : ''}</td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td class="rate-col">${item.rate}</td>
                        <td></td>
                        <td></td>
                    </tr>`;
                    catTotal.opening += item.stock;
                });

                // Add 3 blank rows per category
                for (let i = 0; i < 3; i++) {
                    html += `<tr class="blank-row"><td>${globalSno++}</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`;
                }

                html += `<tr class="subtotal-row">
                    <td colspan="2">${cat} Subtotal</td>
                    <td>${showOpening ? catTotal.opening : ''}</td>
                    <td></td><td></td><td></td><td></td><td></td><td></td>
                </tr>`;
                html += `</table>`;

                grandTotal.opening += catTotal.opening;
            });

            html += `<table style="margin-top:8px;">
                <tr class="grand-total">
                    <td style="width:38%;">GRAND TOTAL</td>
                    <td style="width:8%;">${showOpening ? grandTotal.opening : ''}</td>
                    <td style="width:8%;"></td>
                    <td style="width:8%;"></td>
                    <td style="width:8%;"></td>
                    <td style="width:9%;"></td>
                    <td style="width:10%;"></td>
                    <td style="width:8%;"></td>
                </tr>
            </table>`;

            return html;
        }

        function renderPriceWise(items, showOpening) {
            const sorted = [...items].sort((a, b) => a.rate - b.rate);
            let html = `<table>
                <tr>
                    <th class="sno-col">S.No</th>
                    <th class="brand-th">Brand Name</th>
                    <th class="num-col">Open</th>
                    <th class="num-col">Rcpt</th>
                    <th class="num-col">Total</th>
                    <th class="num-col">Sale</th>
                    <th class="rate-th">Rate</th>
                    <th class="amt-col">Amount</th>
                    <th class="num-col">Close</th>
                </tr>`;

            let total = { opening: 0 };
            sorted.forEach((item, idx) => {
                html += `<tr>
                    <td>${idx + 1}</td>
                    <td class="brand-col">${item.brand}</td>
                    <td>${showOpening ? item.stock : ''}</td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td class="rate-col">${item.rate}</td>
                    <td></td>
                    <td></td>
                </tr>`;
                total.opening += item.stock;
            });

            // Add 5 blank rows
            for (let i = 0; i < 5; i++) {
                html += `<tr class="blank-row"><td>${sorted.length + i + 1}</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`;
            }

            html += `<tr class="grand-total">
                <td colspan="2">GRAND TOTAL</td>
                <td>${showOpening ? total.opening : ''}</td>
                <td></td><td></td><td></td><td></td><td></td><td></td>
            </tr></table>`;

            return html;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => renderPages());
    </script>
